name: 技術的不具合 / Technical Bug Report
description: 公開可能で再現性のある技術的不具合を報告します。 Report a publicly shareable and reproducible technical problem.
title: '[Bug] '
labels:
- bug
- needs-triage
body:
- type: markdown
  attributes:
    value: '## 投稿前の確認 / Before submitting


      このIssueは公開されます。個人情報、認証情報、購入情報、私的な対話履歴、未修正脆弱性の詳細を投稿しないでください。


      This Issue is public. Do not post personal information, credentials, purchase information, private conversation history,
      or details of an unresolved vulnerability.


      Security上の懸念は公開せず、[GitHub Security](https://github.com/GeneSIS-Public/G.E.N.E/security)の非公開経路を使用してください。 For security concerns, use the private route
      in the [GitHub Security](https://github.com/GeneSIS-Public/G.E.N.E/security).'
- type: checkboxes
  id: precheck
  attributes:
    label: 事前確認 / Pre-submission checks
    options:
    - label: 既存Issueを検索し、同じ報告がないことを確認しました。 / I searched existing Issues and did not find the same report.
      required: true
    - label: 公開してはいけない情報を含めていません。 / I have not included information that should remain private.
      required: true
    - label: 未修正のSecurity問題ではありません。 / This is not an unresolved security issue.
      required: true
- type: dropdown
  id: version
  attributes:
    label: G.E.N.E Version / G.E.N.E version
    description: 問題を確認したVersionを選択してください。 Select the version where the issue occurred.
    options:
    - G.E.N.E Alpha v1.0
    - Other / その他
    - Unknown / 不明
  validations:
    required: true
- type: input
  id: build
  attributes:
    label: Build ID / Build identifier
    description: 確認できない場合はUnknownと入力してください。 Enter Unknown if it cannot be confirmed.
    placeholder: G.E.N.E_Alpha_v1.0_R10-4D-4_Build-005 or Unknown
  validations:
    required: true
- type: dropdown
  id: category
  attributes:
    label: 問題の分類 / Issue category
    description: 最も近い分類を選択してください。 Select the closest category.
    options:
    - 起動・終了 / Startup or shutdown
    - UI・表示 / UI or display
    - 保存・読込 / Save or load
    - Persona
    - Dialogue History
    - Summary
    - Knowledge
    - Referenceファイル / Reference files
    - Runtime・Model接続 / Runtime or model connection
    - 性能・Timeout / Performance or timeout
    - その他 / Other
  validations:
    required: true
- type: textarea
  id: windows_environment
  attributes:
    label: Windows環境 / Windows environment
    description: 確認できる情報を記載し、不明な項目はUnknownとしてください。完全なLocal PathやLocal Usernameは記載しないでください。 Provide the information you can
      confirm and enter Unknown where necessary. Do not include an unredacted full local path or local user name.
    placeholder: 'Windows version and edition:

      OS build:

      CPU:

      GPU:

      RAM / VRAM:

      Installation method or location category:

      Example: Extracted to a user-managed local folder

      Other relevant environment details:'
  validations:
    required: true
- type: textarea
  id: local_llm
  attributes:
    label: 外部ローカルLLM環境 / External local LLM environment
    description: 該当するRuntimeとModel情報を記載してください。Model接続前に発生した問題はNot applicableとしてください。 Provide applicable runtime and model
      information. Enter Not applicable if the issue occurred before model connection.
    placeholder: 'Runtime:

      Runtime version:

      Model:

      Model version or tag:

      Relevant configuration:

      Or: Not applicable'
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: 問題の概要 / Problem summary
    description: 発生した問題を簡潔に説明してください。 Describe the problem clearly.
    placeholder: 何が起きたかを簡潔に記載してください。 / Briefly describe what happened.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: 再現手順 / Steps to reproduce
    description: 問題が発生するまでの操作を順番に記載してください。 List the actions leading to the issue.
    placeholder: '1.

      2.

      3.'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 期待した動作 / Expected behavior
    description: 本来どう動作すると考えたかを記載してください。 Describe what you expected to happen.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 実際の動作 / Actual behavior
    description: 実際に発生した動作を記載してください。 Describe what actually happened.
  validations:
    required: true
- type: dropdown
  id: frequency
  attributes:
    label: 再現頻度 / Reproduction frequency
    options:
    - 毎回 / Every time
    - 頻繁 / Frequently
    - 時々 / Sometimes
    - 一度だけ / Once
    - 不明 / Unknown
  validations:
    required: true
- type: textarea
  id: public_logs
  attributes:
    label: 公開可能なLog・画面情報 / Publicly shareable logs or screenshots
    description: 秘密情報、個人情報、完全なLocal Path、私的対話を除去した内容だけを添付してください。 Attach only material with secrets, personal information,
      full local paths, and private dialogue removed.
    placeholder: Drag and drop files here, or enter Not available / 添付できない場合はNot available
- type: textarea
  id: workaround
  attributes:
    label: 確認済みの回避方法 / Confirmed workaround
    description: 回避方法がある場合だけ記載してください。 Enter a workaround only if one is known.
- type: textarea
  id: additional
  attributes:
    label: 補足 / Additional context
    description: 調査に必要と思われる追加情報があれば記載してください。 Add any other relevant information.
